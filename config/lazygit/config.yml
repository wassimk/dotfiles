git:
  diffRenderers:
    - command: difft --color=always
      type: extDiff
    - name: git (moved dimmed)
      type: rawGit
      args: ["--color-moved=dimmed-zebra", "--color-moved-ws=allow-indentation-change"]
  overrideGpg: true
gui:
  nerdFontsVersion: "3"
  theme:
    selectedLineBgColor:
      - white
  showCommandLog: false
  showBottomLine: false
  showPanelJumps: false
  showListFooter: false
keybinding:
  universal:
    scrollDownMain: <c-d>
    scrollUpMain: <c-u>
